<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRACE</title>
  <meta name="description" content="TRACE is a UX research repository that connects observations to the design decisions they support.">
  <meta name="theme-color" content="#F6F4EF">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/schibsted-grotesk-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Main">
      <a class="brand" href="#/" aria-label="TRACE dashboard">
        <span class="brand-word">TRACE</span>
        <span class="brand-thread" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      </a>
      <p class="brand-tagline">Every design decision has a story.</p>
      <nav class="nav">
        <ul>
          <li><a href="#/" data-nav="dashboard"><span data-icon="layout-dashboard"></span>Dashboard</a></li>
          <li><a href="#/projects" data-nav="projects"><span data-icon="folder-kanban"></span>Projects</a></li>
          <li><a href="#/library" data-nav="library"><span data-icon="library"></span>Research library</a></li>
          <li><a href="#/trail" data-nav="trail"><span data-icon="waypoints"></span>Evidence trail</a></li>
          <li><a href="#/sessions" data-nav="sessions"><span data-icon="calendar-days"></span>Sessions</a></li>
          <li><a href="#/participants" data-nav="participants"><span data-icon="users"></span>Participants</a></li>
          <li><a href="#/reference" data-nav="reference"><span data-icon="tags"></span>Team and methods</a></li>
        </ul>
      </nav>
      <p class="sidebar-note">All sample projects, people and results in TRACE are fictional.</p>
    </aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="main-col">
      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"><span data-icon="menu"></span></button>
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
        <form class="global-search" id="global-search" role="search">
          <label class="visually-hidden" for="global-q">Search research records</label>
          <span data-icon="search"></span>
          <input id="global-q" name="q" type="search" placeholder="Search research" autocomplete="off">
        </form>
        <div class="topbar-status" id="status"></div>
      </header>
      <div id="banner"></div>
      <main id="main" class="main" tabindex="-1">
        <div class="state state-loading" role="status"><span class="spinner" aria-hidden="true"></span><span>Starting TRACE…</span></div>
      </main>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>
  <noscript><p class="noscript">TRACE needs JavaScript enabled to run.</p></noscript>
</body>
</html>
